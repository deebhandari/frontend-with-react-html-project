<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box1 {
      /* . is used to call class */
      /* # is used to call ID */
      height: 200px;
      width: 200px;
      /* background-color: yellow; */
      background-image: url('https://picsum.photos/id/23/200/200');

      border: 10px solid red;
      /* border width, border style and border color
      and mixed those values to single value
      We call it "CSS Shorthand Rule"
      */
      border-top: 30px solid lawngreen;
      border-radius: 30px;
      margin-top: 30px;
      margin-bottom: 30px;
    }

    .box2 {
      height: 200px;
      width: 200px;
      background-image: url('https://picsum.photos/id/28/200/200');

    }

    .btn {
      /* height: 100px; */
      /* width: 400px; */
      /* padding: 30px 50px 10px 40px; */
      font-size: 40px;
      background-color: greenyellow;
      border: none;
      border-radius: 30px;
    }

    .btn:hover {
      background-color: orange;
    }
  </style>
</head>

<body>

  <button class="btn">Login</button>
  <div class="box1">
    <h3>Welcome to CSS</h3>
  </div>
  <div class="box2">Hello</div>

</body>

</html>
